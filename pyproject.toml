[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-tool"
version = "0.1.0"
description = "CLI tools for Tapo camera recordings"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "argcomplete",
  "pytapo",
]

[project.scripts]
tapo-tool = "tapo_tool:main"
